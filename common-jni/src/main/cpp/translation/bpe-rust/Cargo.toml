[package]
name = "hearth-byte-bpe"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["staticlib"]

[dependencies]
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
