name: Native host checks
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/native-host.yml'
      - 'common-jni/src/main/cpp/**'
      - 'scripts/speech/test_package.py'
      - 'scripts/voice/**'
      - 'scripts/ming/**'
      - 'scripts/speech/run-expansion-tests.sh'
      - 'scripts/native_abis.py'
      - 'scripts/test_native_abis.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - run: bash common-jni/src/main/cpp/common/tests/run_common_utils_tests.sh
      - name: Speech host checks with Clang
        # Match the production NDK compiler family for the private Whisper API.
        env:
          CXX: clang++
        run: |
          "$CXX" --version
          bash common-jni/src/main/cpp/speech/tests/run_speech_tests.sh
      - run: bash common-jni/src/main/cpp/ocr/tests/run_ocr_tests.sh
      - run: bash common-jni/src/main/cpp/vosk/tests/run_vosk_api_tests.sh
      - run: bash common-jni/src/main/cpp/voice/tests/run_voice_tests.sh
      - run: python3 -m unittest discover -s scripts/voice -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/ming -p 'test_*.py'
      - run: bash scripts/voice/run-magpie-jni-contract-test.sh
      - run: CXX=clang++ bash scripts/speech/run-expansion-tests.sh
      - run: python3 scripts/speech/test_package.py
      - run: python3 -m unittest discover -s scripts -p 'test_native_abis.py'
